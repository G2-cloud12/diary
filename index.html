<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DAYSPACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--t:#ece8ff;--m:#a9a3d1;--ac:#f3a6cf;--ac2:#9b8cff;--gl:rgba(24,20,62,.55);--ln:rgba(255,255,255,.13);--tint:rgba(12,10,46,.5);--in:rgba(255,255,255,.07);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Zen Kaku Gothic New','Hiragino Sans','Segoe UI',sans-serif;color-scheme:dark}
[data-theme=twilight]{--ac:#cfa4ff;--ac2:#7c6cf0;--gl:rgba(42,22,74,.55);--tint:rgba(38,14,70,.5)}
[data-theme=sakura]{--ac:#ff9cc2;--ac2:#d98cff;--gl:rgba(72,22,64,.5);--tint:rgba(62,16,58,.42);--m:#dbb2d0}
[data-theme=lavender]{--t:#28224e;--m:#645d92;--ac:#8b6cf0;--ac2:#e58fc0;--gl:rgba(247,243,255,.66);--ln:rgba(80,60,140,.2);--tint:rgba(220,210,250,.3);--in:rgba(255,255,255,.65);color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.6 var(--sans);color:var(--t);background:#0b0b24;min-height:100dvh;-webkit-font-smoothing:antialiased}
#bg,#tint,#fx{position:fixed;inset:0;pointer-events:none}
#bg{z-index:-3}.layer{position:absolute;inset:0;opacity:0;transition:opacity 3s ease}.layer.on{opacity:1}.layer svg{width:100%;height:100%;display:block}
#tint{z-index:-2;background:radial-gradient(ellipse at 50% 40%,transparent 30%,var(--tint) 100%),linear-gradient(var(--tint),transparent 35%,var(--tint))}
#fx{z-index:-1}
.tw{animation:tw 6s ease-in-out infinite}@keyframes tw{50%{opacity:.12}}
.p{display:none;position:fixed;top:-20px;width:11px;height:8px;background:var(--ac);border-radius:100% 0 100% 0;opacity:0}
.petals .p{display:block;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-5vh) rotate(0);opacity:0}10%{opacity:.65}100%{transform:translate(140px,106vh) rotate(560deg);opacity:0}}
#fx.rain{background:repeating-linear-gradient(104deg,transparent 0 26px,rgba(190,200,255,.13) 26px 27px);background-size:100% 100%;animation:rain .7s linear infinite}
@keyframes rain{to{background-position:-60px 160px}}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1120px;margin:0 auto;padding:24px}
.nav{position:sticky;top:24px;align-self:start}
.brand{font:600 1.9rem/1 var(--serif);letter-spacing:.14em;margin:6px 14px 2px}.kana{font-size:.8rem;color:var(--m);margin:0 14px 18px;letter-spacing:.3em}
.nav button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:var(--m);font:inherit;padding:10px 14px;border-radius:12px;cursor:pointer;text-align:left;transition:background .25s,color .25s}
.nav button:hover,.nav button.on{background:var(--in);color:var(--t)}.nav button.on{box-shadow:inset 3px 0 var(--ac)}
.nav i{font-style:normal;width:1.2em;text-align:center}
#main{max-width:820px;width:100%}
#main>*{animation:in .5s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--gl);border:1px solid var(--ln);border-radius:20px;backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);padding:22px 24px;margin-bottom:16px;box-shadow:0 12px 44px rgba(5,4,28,.3)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}h1{font-size:2.2rem;line-height:1.15}h2{font-size:1.5rem}h3{font-size:1.2rem;margin-bottom:8px}
.sub{color:var(--m);margin:6px 0 14px;font-family:var(--serif);font-style:italic;font-size:1.25rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{background:var(--in);border:1px solid var(--ln);border-radius:99px;padding:3px 14px;font-size:.85rem;color:var(--m)}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:10px}.sp{flex:1}.bar h2{font-size:1.35rem}
.pill{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#1b1038;border:0;border-radius:99px;padding:8px 18px;font:inherit;font-weight:500;cursor:pointer;transition:transform .2s,filter .2s}.pill:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ib{background:none;border:0;color:var(--m);font:inherit;font-size:1.1rem;cursor:pointer;padding:4px 9px;border-radius:8px}.ib:hover{color:var(--ac)}
input,select,textarea{font:inherit;color:var(--t);background:var(--in);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;max-width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.form{display:flex;gap:10px;flex-wrap:wrap}.form input:first-child{flex:1;min-width:160px}
.moods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.moods button{background:none;border:1px solid var(--ln);color:var(--m);border-radius:99px;padding:2px 13px;font:inherit;font-size:.85rem;cursor:pointer}.moods button.on{background:var(--in);color:var(--t);border-color:var(--ac)}
#ed{display:block;width:100%;min-height:48vh;resize:none;background:transparent;border:0;padding:8px 2px;font:1.3rem/1.95 var(--serif);caret-color:var(--ac)}#ed:focus{outline:0}
.foot{display:flex;justify-content:space-between;color:var(--m);font-size:.85rem}
.row{display:flex;align-items:flex-start;gap:6px;padding:12px 0;border-top:1px solid var(--ln)}.row:first-child{border-top:0}
.row[data-a=open]{cursor:pointer}.rb{flex:1;min-width:0}.rb small{color:var(--m)}.rb b{display:block;font:600 1.15rem var(--serif)}.rb p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.late small{color:#ff9aa8}.dn p{text-decoration:line-through;opacity:.55}
.hint,.empty{color:var(--m);font-size:.9rem;margin:10px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal b{font-weight:400;color:var(--m);font-size:.8rem}
.cal button{aspect-ratio:1;min-height:42px;background:var(--in);border:1px solid transparent;border-radius:12px;color:var(--t);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal button.now{border-color:var(--ac2)}.cal button.sel{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#1b1038}
.cal span{display:flex;gap:3px;height:6px}.cal u{width:5px;height:5px;border-radius:50%;background:var(--ac)}.cal u.o{background:var(--ac2)}
.sw{display:inline-flex;align-items:center;gap:8px;margin:0 8px 8px 0;background:var(--in);border:1px solid var(--ln);border-radius:99px;padding:6px 14px;color:var(--t);font:inherit;cursor:pointer}
.sw:before{content:'';width:14px;height:14px;border-radius:50%;background:var(--c)}.sw.on{border-color:var(--ac)}
.set label{display:block;margin:14px 0 6px;color:var(--m);font-size:.9rem}
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,5,30,.55);padding:16px;z-index:5}.modal .card{width:min(640px,100%);margin:0}
#nt{width:100%;font:600 1.4rem var(--serif);margin-bottom:8px}#nb{width:100%;min-height:42vh;resize:vertical;font:1.1rem/1.8 var(--serif)}
#ts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--gl);border:1px solid var(--ln);backdrop-filter:blur(16px);padding:10px 20px;border-radius:99px;z-index:9;opacity:0;pointer-events:none;transition:opacity .4s;max-width:92vw}#ts.on{opacity:1}
#xf{position:fixed;top:14px;right:14px;z-index:4;display:none}
body.focus .nav,body.focus .hero,body.focus .mem,body.focus .moods,body.focus .bar{display:none}body.focus #xf{display:block}
body.focus .shell{display:block;max-width:820px;padding-top:7vh}body.focus .ed{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}body.focus #ed{min-height:78vh;font-size:1.45rem}
@media(max-width:760px){.shell{display:block;padding:14px 14px 96px}.nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:4;display:flex;overflow-x:auto;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--gl);border-top:1px solid var(--ln);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand,.kana{display:none}.nav button{flex-direction:column;gap:0;width:auto;min-width:64px;padding:6px 8px;font-size:.7rem;text-align:center}h1{font-size:1.8rem}#ed{font-size:1.2rem;min-height:42vh}#ts{bottom:96px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"><div class="layer"></div><div class="layer"></div></div><div id="tint"></div><div id="fx"></div>
<button class="pill" id="xf" data-a="focus">Exit focus</button>
<div class="shell">
<nav class="nav"><div class="brand">DAYSPACE</div><div class="kana">日々の空間</div>
<button data-a="nav" data-v="diary"><i>✎</i>Diary</button><button data-a="nav" data-v="thoughts"><i>✧</i>Thoughts</button><button data-a="nav" data-v="notes"><i>❏</i>Notes</button><button data-a="nav" data-v="rem"><i>◔</i>Reminders</button><button data-a="nav" data-v="cal"><i>▦</i>Calendar</button><button data-a="nav" data-v="fav"><i>♡</i>Favourites</button><button data-a="nav" data-v="search"><i>⌕</i>Search</button><button data-a="nav" data-v="set"><i>⚙</i>Settings</button></nav>
<main id="main"></main></div>
<div id="md" class="modal" hidden><div class="card"><input id="nt" placeholder="Title" aria-label="Note title"><textarea id="nb" placeholder="Write your note…" aria-label="Note text"></textarea><div class="bar"><button class="ib" data-a="nfav" id="nf" title="Favourite">☆</button><button class="ib" data-a="ndel">Delete</button><span class="sp"></span><button class="pill" data-a="nclose">Done</button></div></div></div>
<div id="ts" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>ymd(new Date());
const fmt=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const when=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const wc=s=>(s||'').trim().split(/\s+/).filter(Boolean).length,uid=()=>'i_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const L={diary:'Diary',thought:'Thought',note:'Note',reminder:'Reminder'},MOODS=['calm','bright','tired','low','inspired'];
const G=["Soft rain, warm light. Write what the day gave you.","Petals fall without hurry. So can you.","A quiet page is waiting. No rush.","Small moments are worth keeping.","Let the evening settle, then begin.","Whatever today held, it can rest here.","Stars don’t compete. Write only for yourself.","One honest line is enough today.","Notice one gentle thing, then write it down.","The city hums far away. Here it is calm.","Slow down. Your thoughts will find their way.","You showed up again. That matters.","Tomorrow is still folded away. Today is yours.","Breathe, then let the words come."];
const S={view:'diary',date:today(),cd:today(),cal:new Date(),q:'',items:[],set:{theme:'midnight',scene:'auto',name:''}};
/* ---------- storage (IndexedDB) ---------- */
let db;const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('dayspace',1);r.onupgradeneeded=()=>{r.result.createObjectStore('items',{keyPath:'id'});r.result.createObjectStore('kv')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const rq=r=>new Promise(ok=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)}),st=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const DB=f=>db?rq(f()):Promise.resolve();
const put=it=>{const i=S.items.findIndex(x=>x.id===it.id);i<0?S.items.push(it):S.items[i]=it;return DB(()=>st('items','readwrite').put(it))};
const del=id=>{S.items=S.items.filter(x=>x.id!==id);return DB(()=>st('items','readwrite').delete(id))};
const saveSet=()=>DB(()=>st('kv','readwrite').put(S.set,'settings'));
const ent=d=>S.items.find(i=>i.id==='d_'+d),newD=d=>({id:'d_'+d,type:'diary',date:d,body:'',mood:'',fav:0,updated:Date.now()});
const kd=i=>i.type==='reminder'?ymd(new Date(i.due)):i.type==='diary'?i.date:ymd(new Date(i.created));
/* ---------- scenes ---------- */
const R=s=>()=>(s=s*16807%2147483647)/2147483647;
const svg=x=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">${x}</svg>`;
const sky=(id,c)=>`<defs><linearGradient id="${id}" x2="0" y2="1">${c.map((k,i)=>`<stop offset="${i/(c.length-1)}" stop-color="${k}"/>`).join('')}</linearGradient></defs><rect width="1600" height="900" fill="url(#${id})"/>`;
const rg=(id,c,o=.85)=>`<defs><radialGradient id="${id}"><stop offset="0" stop-color="${c}" stop-opacity="${o}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs>`;
const SC=[['Sakura dawn',()=>{const r=R(7);let b='';for(let i=0;i<150;i++){const x=r()*980,y=110+Math.sin(x/150)*45+r()*150;b+=`<circle cx="${x|0}" cy="${y|0}" r="${(5+r()*12)|0}" fill="${['#ffc2dc','#ffa8cd','#ffd9ea','#f78fbd'][i%4]}" opacity="${(.55+r()*.4).toFixed(2)}"/>`}
return svg(sky('s0',['#241a5a','#6d4fa8','#d98bb8','#ffc9c9'])+rg('m0','#fff0f6')+`<circle cx="1160" cy="330" r="280" fill="url(#m0)"/><circle cx="1160" cy="330" r="64" fill="#fff4f8"/><path d="M0 640Q260 520 520 620T980 590T1320 610T1600 570V900H0Z" fill="#4b3a8a" opacity=".75"/><path d="M0 730Q330 650 700 710T1360 700T1600 690V900H0Z" fill="#2a2062"/><path d="M-20 150Q300 120 560 270T980 250" stroke="#25173f" stroke-width="16" fill="none"/>`+b)}],
['Rainy street',()=>{const r=R(11);let b='',x=-20;while(x<1620){const w=(90+r()*110)|0,h=(280+r()*260)|0,y=760-h;b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${r()<.5?'#13123f':'#1b1850'}"/>`;for(let j=0;j<(w/28|0);j++)for(let k=0;k<(h/46|0);k++)if(r()<.38)b+=`<rect x="${x+12+j*28}" y="${y+16+k*46}" width="14" height="22" rx="2" fill="${r()<.7?'#ffd8a0':'#ffa6cf'}" opacity="${(.5+r()*.5).toFixed(2)}"/>`;x+=w+(r()*12|0)}
return svg(sky('s1',['#080a2c','#1f1b57','#4a2f7a'])+rg('l1','#ffcf8e')+b+`<rect y="760" width="1600" height="140" fill="#0c0b2b"/><rect y="760" width="1600" height="3" fill="#6e5fc0" opacity=".45"/><circle cx="1240" cy="560" r="170" fill="url(#l1)"/><rect x="1236" y="545" width="8" height="225" fill="#0a0922"/><circle cx="1240" cy="545" r="12" fill="#fff0c9"/><ellipse cx="1240" cy="830" rx="200" ry="26" fill="url(#l1)" opacity=".6"/>`)}],
['Starry night',()=>{const r=R(23);let s='';for(let i=0;i<230;i++)s+=`<circle class="${i%3?'':'tw'}" style="animation-delay:-${(r()*6).toFixed(1)}s" cx="${r()*1600|0}" cy="${r()*620|0}" r="${(.5+r()*1.4).toFixed(1)}" fill="#fff" opacity="${(.4+r()*.6).toFixed(2)}"/>`;
return svg(sky('s2',['#04051a','#161050','#4b2a7c','#a2519b'])+s+rg('m2','#ffeccf',.5)+`<circle cx="1230" cy="210" r="150" fill="url(#m2)"/><path d="M1230 138a72 72 0 1 0 0 144a56 56 0 1 1 0-144z" fill="#fff1d3"/><path d="M0 700Q240 600 520 690T1040 650T1600 700V900H0Z" fill="#150f3f"/><path d="M0 790Q400 720 800 780T1600 770V900H0Z" fill="#0b0828"/>`)}],
['Dusk lanterns',()=>{const r=R(31);let b='',l='',x=-10;while(x<1620){const w=(70+r()*90)|0,h=(160+r()*300)|0;b+=`<rect x="${x}" y="${790-h}" width="${w}" height="${h}" fill="${['#3a2468','#2c1c58','#44286e'][r()*3|0]}"/>`;x+=w+(r()*8|0)}
for(let i=0;i<9;i++){const px=520+i*120,y=400+110*(1-((px-1000)/540)**2)|0;l+=`<circle cx="${px}" cy="${y}" r="46" fill="url(#g3)"/><circle cx="${px}" cy="${y}" r="10" fill="#ffc0d4"/>`}
return svg(sky('s3',['#2e2266','#8a4f9e','#e98fb0','#ffc9b5'])+rg('g3','#ff9ec0')+rg('u3','#fff2e0',.7)+`<circle cx="1050" cy="640" r="230" fill="url(#u3)"/><circle cx="1050" cy="640" r="70" fill="#fff0dc"/>`+b+`<path d="M460 400Q1000 540 1600 380M0 330Q300 400 600 340" stroke="#1d1240" stroke-width="2" fill="none"/>`+l+`<g fill="#7a2150"><rect x="170" y="440" width="22" height="350"/><rect x="330" y="440" width="22" height="350"/><rect x="140" y="408" width="240" height="26" rx="4"/><rect x="165" y="474" width="210" height="14"/></g><rect y="790" width="1600" height="110" fill="#1a1040"/>`)}]];
let cur=-1,front=0,auto=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5)%4;
function scene(i){if(i===cur)return;cur=i;const Ls=document.querySelectorAll('.layer');front^=1;Ls[front].innerHTML=SC[i][1]();Ls[front].classList.add('on');Ls[1-front].classList.remove('on');$('#fx').className=['petals','rain','','petals'][i]}
const applyScene=()=>scene(S.set.scene==='auto'?auto%4:+S.set.scene);
setInterval(()=>{if(S.set.scene==='auto'){auto++;applyScene()}},120000);
(()=>{const r=R(5);for(let i=0;i<18;i++){const p=document.createElement('span');p.className='p';p.style.cssText=`left:${r()*100}%;animation-duration:${9+r()*8}s;animation-delay:-${r()*14}s;transform:scale(${.7+r()*.8})`;$('#fx').appendChild(p)}})();
/* ---------- helpers ---------- */
let tm,draft,cn,tt;
function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4500)}
function streak(){const ds=S.items.filter(i=>i.type==='diary'&&i.body.trim()),set=new Set(ds.map(i=>i.date));let d=new Date(),n=0;if(!set.has(ymd(d)))d.setDate(d.getDate()-1);while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1)}
let best=0,run=0,prev=null;[...set].sort().forEach(s=>{const t=Date.parse(s+'T00:00');run=prev!==null&&t-prev<=1.5*864e5?run+1:1;prev=t;best=Math.max(best,run)});return[n,best,ds.length]}
const chips=()=>{const[n,b,c]=streak();return`<span>◆ ${n} day streak</span><span>Best ${b}</span><span>${c} entries</span>`};
function greet(){const h=new Date().getHours(),p=h<5?'Still up':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';return[p+(S.set.name?', '+esc(S.set.name):''),G[Math.floor(Date.now()/864e5)%G.length]]}
const row=i=>{const t=i.type==='diary'?fmt(i.date):i.title;return`<div class="row" ${i.type==='note'||i.type==='diary'?`data-a="open" data-id="${i.id}"`:''}><div class="rb"><small>${L[i.type]} · ${when(i.updated||i.created)}${i.mood?' · '+i.mood:''}</small>${t?`<b>${esc(t)}</b>`:''}<p>${esc((i.body||'').slice(0,220))}</p></div><button class="ib" data-a="fav" data-id="${i.id}" title="Favourite">${i.fav?'★':'☆'}</button><button class="ib" data-a="del" data-id="${i.id}" title="Delete">✕</button></div>`};
const list=a=>a.length?a.map(row).join(''):'';
const byNew=a=>a.sort((x,y)=>(y.updated||y.created)-(x.updated||x.created));
const mem=()=>{const m=S.items.filter(i=>i.type==='diary'&&i.body.trim()&&i.date<S.date&&i.date.slice(5)===S.date.slice(5));return m.length?`<section class="card mem"><h3>On this day</h3>${list(m)}</section>`:''};
/* ---------- views ---------- */
const V={};
V.diary=()=>{const e=ent(S.date)||{},[h,s]=greet();return`<section class="card hero"><h1>${h}</h1><p class="sub">${s}</p><div class="chips" id="ch">${chips()}</div></section>
<section class="card ed"><div class="bar"><button class="ib" data-a="day" data-n="-1" aria-label="Previous day">‹</button><h2>${fmt(S.date)}</h2><button class="ib" data-a="day" data-n="1" aria-label="Next day">›</button><span class="sp"></span><button class="ib" data-a="fav" data-id="d_${S.date}" id="fv" title="Favourite">${e.fav?'★':'☆'}</button><button class="pill" data-a="focus">Focus</button></div>
<div class="moods">${MOODS.map(m=>`<button data-a="mood" data-m="${m}" class="${e.mood===m?'on':''}">${m}</button>`).join('')}</div>
<textarea id="ed" placeholder="What is on your mind today?" aria-label="Diary entry">${esc(e.body||'')}</textarea><div class="foot"><span id="wc">${wc(e.body)} words</span><span id="sv"></span></div></section>${mem()}`};
V.thoughts=()=>`<section class="card"><h2>Thoughts and ideas</h2><div class="form" style="margin-top:12px"><input id="ti" placeholder="Capture a thought…" aria-label="New thought"><button class="pill" data-a="addth">Add</button></div></section><section class="card">${list(byNew(S.items.filter(i=>i.type==='thought')))||'<p class="empty">No thoughts yet. Capture the first one above.</p>'}</section>`;
V.notes=()=>`<section class="card"><div class="bar"><h2>Notes</h2><span class="sp"></span><button class="pill" data-a="newnote">New note</button></div>${list(byNew(S.items.filter(i=>i.type==='note')))||'<p class="empty">No notes yet. Start one with New note.</p>'}</section>`;
V.rem=()=>{const r=S.items.filter(i=>i.type==='reminder').sort((a,b)=>a.done-b.done||a.due-b.due),np='Notification'in window?Notification.permission:'none';
return`<section class="card"><h2>Reminders</h2><div class="form" style="margin-top:12px"><input id="rt" placeholder="Remind me to…" aria-label="Reminder"><input id="rd" type="datetime-local" aria-label="When"><button class="pill" data-a="addrem">Add</button></div><p class="hint">${np==='granted'?'Notifications are on. They appear while DAYSPACE is open in a browser tab.':np==='none'?'This browser does not support notifications. Reminders still appear inside DAYSPACE.':'<button class="pill" data-a="notif">Enable notifications</button>'}</p></section>
<section class="card">${r.map(i=>`<div class="row ${i.done?'dn':i.due<Date.now()?'late':''}"><input type="checkbox" data-a="done" data-id="${i.id}" ${i.done?'checked':''} aria-label="Done" style="margin-top:6px"><div class="rb"><small>${new Date(i.due).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}</small><p>${esc(i.body)}</p></div><button class="ib" data-a="del" data-id="${i.id}" title="Delete">✕</button></div>`).join('')||'<p class="empty">No reminders. Add one with a date and time.</p>'}</section>`};
V.cal=()=>{const c=S.cal,y=c.getFullYear(),m=c.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),mk={};
S.items.forEach(i=>{if(i.type==='diary'&&!i.body.trim())return;(mk[kd(i)]=mk[kd(i)]||new Set()).add(i.type)});
let cells='';for(let i=0;i<off;i++)cells+='<i></i>';
for(let d=1;d<=n;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`,t=mk[k]||new Set();cells+=`<button data-a="cd" data-d="${k}" class="${k===S.cd?'sel ':''}${k===today()?'now':''}">${d}<span>${t.has('diary')?'<u></u>':''}${t.size>(t.has('diary')?1:0)?'<u class="o"></u>':''}</span></button>`}
const di=S.items.filter(i=>kd(i)===S.cd&&!(i.type==='diary'&&!i.body.trim())),mm=S.items.filter(i=>i.type==='diary'&&i.body.trim()&&i.date<S.cd&&i.date.slice(5)===S.cd.slice(5));
return`<section class="card"><div class="bar"><button class="ib" data-a="cm" data-n="-1" aria-label="Previous month">‹</button><h2>${c.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="ib" data-a="cm" data-n="1" aria-label="Next month">›</button></div><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<b>${x}</b>`).join('')}${cells}</div></section>
<section class="card"><div class="bar"><h3 style="margin:0">${fmt(S.cd)}</h3><span class="sp"></span><button class="pill" data-a="godiary">Open diary</button></div>${list(di)||'<p class="empty">Nothing saved on this day.</p>'}</section>${mm.length?`<section class="card"><h3>Memories</h3>${list(mm)}</section>`:''}`};
V.fav=()=>`<section class="card"><h2>Favourites</h2>${list(byNew(S.items.filter(i=>i.fav)))||'<p class="empty">Star an entry, note or thought and it will appear here.</p>'}</section>`;
const results=()=>{const q=S.q.trim().toLowerCase();if(!q)return'<p class="empty">Type to search everything you have written.</p>';const r=byNew(S.items.filter(i=>((i.title||'')+' '+(i.body||'')).toLowerCase().includes(q))).slice(0,60);return list(r)||'<p class="empty">No matches.</p>'};
V.search=()=>`<section class="card"><input id="q" style="width:100%" placeholder="Search diary, thoughts, notes and reminders…" value="${esc(S.q)}" aria-label="Search"><div id="res" style="margin-top:10px">${results()}</div></section>`;
V.set=()=>{const T=[['midnight','Midnight','#1b1850'],['twilight','Twilight','#5a3a99'],['sakura','Sakura','#c0548f'],['lavender','Lavender','#c8b8f5']];
return`<section class="card set"><h2>Settings</h2><label>Theme</label>${T.map(t=>`<button class="sw ${S.set.theme===t[0]?'on':''}" style="--c:${t[2]}" data-a="theme" data-v="${t[0]}">${t[1]}</button>`).join('')}
<label for="sc">Background scene</label><select id="sc"><option value="auto">Rotate automatically</option>${SC.map((s,i)=>`<option value="${i}" ${String(S.set.scene)===String(i)?'selected':''}>${s[0]}</option>`).join('')}</select>
<label for="nm">Your name (for the daily greeting)</label><input id="nm" value="${esc(S.set.name)}" placeholder="Optional">
<label>Backup</label><button class="pill" data-a="exp">Export JSON</button> <button class="pill" data-a="imp">Import JSON</button><input type="file" id="imp" accept="application/json" hidden>
<p class="hint">Everything stays in this browser’s IndexedDB. Nothing is uploaded. Export a backup before clearing browser data.</p></section>`};
function render(){flush();document.querySelectorAll('.nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));$('#main').innerHTML=V[S.view]();window.scrollTo(0,0)}
/* ---------- actions ---------- */
async function flush(){clearTimeout(tm);if(!draft)return;const{d,v}=draft;draft=null;const e=ent(d)||newD(d);e.body=v;e.updated=Date.now();await put(e);const s=$('#sv');if(s)s.textContent='Saved';const c=$('#ch');if(c)c.innerHTML=chips()}
function noteSave(){if(!cn)return;cn.title=$('#nt').value;cn.body=$('#nb').value;cn.updated=Date.now();if(cn.title||cn.body)put(cn)}
function openNote(id){cn=S.items.find(i=>i.id===id)||{id:uid(),type:'note',title:'',body:'',created:Date.now(),fav:0};$('#nt').value=cn.title;$('#nb').value=cn.body;$('#nf').textContent=cn.fav?'★':'☆';$('#md').hidden=false;$('#nb').focus()}
function closeNote(){$('#md').hidden=true;cn=null;if(S.view!=='diary')render()}
function check(){const n=Date.now();S.items.filter(i=>i.type==='reminder'&&!i.done&&!i.notified&&i.due<=n).forEach(i=>{i.notified=1;put(i);toast('Reminder: '+i.body);if('Notification'in window&&Notification.permission==='granted')new Notification('DAYSPACE',{body:i.body});if(S.view==='rem')render()})}
function exitFocus(){document.body.classList.remove('focus')}
const A={nav:t=>{exitFocus();S.view=t.dataset.v;render()},
day:t=>{const d=new Date(S.date+'T00:00');d.setDate(d.getDate()+ +t.dataset.n);S.date=ymd(d);render()},
async fav(t){const id=t.dataset.id;let i=S.items.find(x=>x.id===id);if(!i&&id.startsWith('d_'))i=newD(id.slice(2));i.fav=i.fav?0:1;await put(i);if(S.view==='diary'&&id==='d_'+S.date)$('#fv').textContent=i.fav?'★':'☆';else render()},
del:t=>{if(confirm('Delete this permanently?'))del(t.dataset.id).then(render)},
open:t=>{const id=t.dataset.id;if(id.startsWith('d_')){S.date=id.slice(2);S.view='diary';render()}else openNote(id)},
focus:()=>{document.body.classList.toggle('focus');if(document.body.classList.contains('focus')&&$('#ed'))$('#ed').focus()},
async mood(t){await flush();const e=ent(S.date)||newD(S.date);e.mood=e.mood===t.dataset.m?'':t.dataset.m;await put(e);document.querySelectorAll('.moods button').forEach(b=>b.classList.toggle('on',b.dataset.m===e.mood))},
addth:()=>{const v=$('#ti').value.trim();if(!v)return;put({id:uid(),type:'thought',body:v,created:Date.now(),fav:0}).then(render)},
addrem:()=>{const v=$('#rt').value.trim(),d=$('#rd').value;if(!v||!d)return toast('Add a reminder and a date.');put({id:uid(),type:'reminder',body:v,due:new Date(d).getTime(),done:0,created:Date.now(),fav:0}).then(render)},
done:t=>{const i=S.items.find(x=>x.id===t.dataset.id);i.done=t.checked?1:0;put(i).then(render)},
newnote:()=>openNote(),nfav:()=>{cn.fav=cn.fav?0:1;$('#nf').textContent=cn.fav?'★':'☆';noteSave()},
ndel:()=>{if(confirm('Delete this note?')){del(cn.id);closeNote()}},nclose:()=>{noteSave();closeNote()},
notif:()=>Notification.requestPermission().then(render),
cm:t=>{S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+ +t.dataset.n,1);render()},
cd:t=>{S.cd=t.dataset.d;render()},godiary:()=>{S.date=S.cd;S.view='diary';render()},
theme:t=>{S.set.theme=t.dataset.v;document.documentElement.dataset.theme=S.set.theme;saveSet();render()},
exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({items:S.items,set:S.set})],{type:'application/json'}));a.download='dayspace-backup-'+today()+'.json';a.click()},
imp:()=>$('#imp').click()};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t)});
document.addEventListener('input',e=>{const i=e.target.id;
if(i==='ed'){draft={d:S.date,v:e.target.value};$('#wc').textContent=wc(draft.v)+' words';$('#sv').textContent='Writing…';clearTimeout(tm);tm=setTimeout(flush,500)}
else if(i==='q'){S.q=e.target.value;$('#res').innerHTML=results()}else if(i==='nt'||i==='nb')noteSave();else if(i==='nm'){S.set.name=e.target.value;saveSet()}});
document.addEventListener('change',async e=>{if(e.target.id==='sc'){S.set.scene=e.target.value;saveSet();applyScene()}
else if(e.target.id==='imp'&&e.target.files[0]){try{const j=JSON.parse(await e.target.files[0].text());for(const i of j.items||[])await put(i);toast('Backup imported.');render()}catch{toast('That file could not be imported.')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){exitFocus();if(!$('#md').hidden)A.nclose()}if(e.key==='Enter'&&e.target.id==='ti')A.addth()});
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
(async()=>{try{db=await open();S.items=await rq(st('items').getAll())||[];Object.assign(S.set,await rq(st('kv').get('settings'))||{})}catch{toast('Local storage is unavailable, so entries will not be saved.')}
document.documentElement.dataset.theme=S.set.theme;applyScene();render();check();setInterval(check,30000)})();
</script>
</body>
</html>
